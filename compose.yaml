# Local development stack.
#
# One service, because the farm is one service: the API with its embedded DuckDB
# file. The web app is not here — it runs on the host with `pnpm dev`, where
# hot reload is fast, and reaches this container through the Next dev server's
# /v1 proxy (see src/apps/web/next.config.ts).
#
#   docker compose up          the API on http://localhost:5700
#   make dev                   the same, plus the web app on :3000
#
# Not a production deployment: it mounts your working tree, runs with reload on,
# and carries a fixed development signing key.

services:
  api:
    build:
      context: .
      target: api-dev
    ports:
      - "5700:5700"
    volumes:
      # The working tree, so an edit under src/ reloads the server. The
      # container's virtualenv lives at /opt/venv, out of this mount's way.
      - .:/app
      # The database is deliberately NOT the repo's ./farm.db. DuckDB allows a
      # single writer and enforces it with a file lock, but that lock does not
      # cross the container boundary — so a host `python src/main.py` and this
      # container could both hold the same file and corrupt it. Its own volume
      # makes that impossible; `docker compose down -v` resets it.
      - farmdb-data:/var/lib/farmdb
    environment:
      ENVIRONMENT: dev
      DATABASE_PATH: /var/lib/farmdb/farm.db
      # A stable dev secret, so a container restart does not sign everyone out.
      # Long enough to clear PyJWT's 32-byte HMAC advice, and obviously not a
      # secret. A real one belongs in .env, which overrides this.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-farmdb-local-development-only-not-a-secret}
      # Bind mounts do not deliver inotify events reliably on macOS, so the
      # reloader watches by polling instead of missing every other save.
      WATCHFILES_FORCE_POLLING: "true"
    env_file:
      - path: .env
        required: false
    # Migrations first and in a process of their own: DuckDB takes a single
    # writer, so they cannot run while the server holds the file.
    command: >
      sh -c "uv run --no-sync farmdb migration apply &&
             uv run --no-sync python src/main.py"
    healthcheck:
      # The API's own schema document — public, and only served once the app has
      # finished starting.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:5700/openapi.json")
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 5s

volumes:
  farmdb-data:

